<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #1a1a1a;
      padding: 40px;
      border-radius: 12px;
      width: 320px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: #ff0000;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .login-box a {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #aaa;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>LOGIN</h2>

    <!-- 🔽 เพิ่ม id + name -->
    <form id="loginForm">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <a href="index.php">← Back to Home</a>
    <a href="register.html">สมัครสมาชิก</a>
  </div>

  <!-- 🔽 SCRIPT LOGIN -->
  <script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = new FormData(form);

      fetch("login_process.php", {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(data => {
        data = data.trim();

        if (data === "success") {
  alert("เข้าสู่ระบบสำเร็จ ✅");
  window.location.href = "index.php";
}
 else if (data === "wrong_password") {
          alert("รหัสผ่านผิด ❌");
        } else if (data === "user_not_found") {
          alert("ไม่พบผู้ใช้ ❌");
        } else {
          alert("เกิดข้อผิดพลาด ❌");
        }
      });
    });
  </script>

</body>
</html>
