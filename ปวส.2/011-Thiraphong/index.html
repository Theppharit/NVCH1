<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hangar Game Store</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#store" aria-label="Hangar หน้าแรก">
      <img src="assets/logo.svg" width="26" height="26" alt="">
      Hangar
    </a>
    <nav class="nav" aria-label="เมนูหลัก">
      <a href="#store" data-view="store">ร้านค้า</a>
      <a href="#wishlist" data-view="wishlist">อยากได้<span class="count num" id="wishCount"></span></a>
      <a href="#library" data-view="library">คลังเกม<span class="count num" id="libCount"></span></a>
    </nav>
    <div class="search" role="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="ค้นหาเกม ผู้พัฒนา หรือแนวเกม" autocomplete="off" aria-label="ค้นหาเกม">
      <div class="suggest" id="suggest" hidden></div>
    </div>
    <button class="cart-btn" id="cartBtn" aria-label="เปิดตะกร้า">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M1.5 2h2.2l2 10h8.6l1.7-7H5"/><circle cx="7" cy="15.5" r="1.2"/><circle cx="13.5" cy="15.5" r="1.2"/></svg>
      <span class="lbl">ตะกร้า</span><span class="num" id="cartCount">0</span>
    </button>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="site"><div class="wrap">
  <span>Hangar · ร้านเกมสำหรับพีซี</span>
  <span>ร้านตัวอย่าง ราคาเป็นบาท (฿) รวมภาษีมูลค่าเพิ่มแล้ว ไม่มีการชำระเงินจริง</span>
</div></footer>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="ตะกร้าสินค้า"></aside>
<div class="toast" id="toast" hidden role="status"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
